<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Quba Character Pop — Full Product Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fffaf4;
        --surface: #ffffff;
        --surface-soft: #f5f0fb;
        --surface-purple: #eee9ff;
        --ink: #171341;
        --muted: #736e89;
        --primary: #baff72;
        --primary-pressed: #a3e95d;
        --primary-soft: #ecffd8;
        --primary-strong: #4c7a24;
        --interactive-text: #2c5a18;
        --on-primary: #171341;
        --orange: #ff982f;
        --pink: #f24f91;
        --green: #148a7a;
        --red: #c64049;
        --line: rgba(30, 22, 71, 0.1);
        --shadow-card:
          0 10px 28px rgba(38, 27, 88, 0.07), 0 2px 5px rgba(38, 27, 88, 0.04);
        --shadow-float:
          0 18px 46px rgba(38, 27, 88, 0.15), 0 3px 8px rgba(38, 27, 88, 0.08);
        --radius-sm: 12px;
        --radius-md: 18px;
        --radius-lg: 24px;
        --radius-xl: 30px;
        --font:
          ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      [data-theme="night"] {
        color-scheme: dark;
        --bg: #121022;
        --surface: #211d36;
        --surface-soft: #29243e;
        --surface-purple: #302754;
        --ink: #faf7ff;
        --muted: #b7b0ca;
        --primary: #baff72;
        --primary-pressed: #a3e95d;
        --primary-soft: #293a1d;
        --primary-strong: #d5ffaa;
        --interactive-text: #baff72;
        --on-primary: #142111;
        --orange: #ffae54;
        --pink: #ff7bab;
        --green: #67d6c3;
        --red: #ff8790;
        --line: rgba(255, 255, 255, 0.1);
        --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.16);
        --shadow-float: 0 18px 46px rgba(0, 0, 0, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 16% 16%,
            rgba(186, 255, 114, 0.24),
            transparent 29%
          ),
          radial-gradient(
            circle at 84% 80%,
            rgba(255, 151, 56, 0.18),
            transparent 26%
          ),
          #f1edf6;
        color: var(--ink);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      ::selection {
        background: var(--primary);
        color: #171341;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .phone {
        position: relative;
        width: min(100%, 414px);
        height: min(870px, calc(100vh - 56px));
        min-height: 700px;
        overflow: hidden;
        border-radius: 42px;
        background: var(--bg);
        box-shadow:
          0 34px 90px rgba(32, 26, 66, 0.19),
          0 0 0 1px rgba(17, 13, 45, 0.08);
      }

      .safe-top {
        height: 14px;
      }

      #screen {
        height: 100%;
      }

      .screen {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        padding: 0 20px 112px;
        background: var(--bg);
      }

      .screen::-webkit-scrollbar {
        display: none;
      }

      .screen.no-nav {
        padding-bottom: 28px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .screen > * {
          animation: enter 200ms ease-out both;
        }

        .screen > *:nth-child(2) {
          animation-delay: 45ms;
        }

        .screen > *:nth-child(3) {
          animation-delay: 90ms;
        }

        .mascot-in {
          animation: mascot-in 240ms ease-out 80ms both;
          transform-origin: bottom right;
        }
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes mascot-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.94) rotate(2deg);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0);
        }
      }

      h1,
      h2,
      h3,
      p {
        overflow-wrap: break-word;
      }

      h1,
      h2 {
        text-wrap: balance;
      }

      p {
        text-wrap: pretty;
      }

      .topbar {
        min-height: 62px;
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        gap: 8px;
      }

      .topbar-title {
        margin: 0;
        text-align: center;
        font-size: 17px;
        line-height: 1.2;
        font-weight: 850;
        letter-spacing: -0.3px;
      }

      .brand {
        font-size: 25px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -1.3px;
      }

      .brand span {
        color: var(--orange);
      }

      .icon-button {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 15px;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        transition:
          transform 150ms ease-out,
          background-color 150ms ease-out;
      }

      .icon-button:hover {
        background: var(--surface-soft);
      }

      .icon-button:active,
      .button:active,
      .nav-button:active,
      .card-button:active,
      .choice:active,
      .counter-button:active {
        transform: scale(0.96);
      }

      .icon {
        width: 23px;
        height: 23px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .icon.fill {
        fill: currentColor;
        stroke: currentColor;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      [tabindex="0"]:focus-visible {
        outline: 3px solid var(--primary-strong);
        outline-offset: 2px;
      }

      .eyebrow {
        margin: 0;
        color: var(--interactive-text);
        font-size: 12px;
        line-height: 1.3;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .display {
        margin: 10px 0 8px;
        font-size: 35px;
        line-height: 1.08;
        font-weight: 900;
        letter-spacing: -1.4px;
      }

      .headline {
        margin: 0;
        font-size: 26px;
        line-height: 1.18;
        font-weight: 900;
        letter-spacing: -0.8px;
      }

      .title {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 850;
        letter-spacing: -0.3px;
      }

      .body {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .caption {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .section-heading {
        margin: 26px 1px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .section-heading h2 {
        margin: 0;
        font-size: 17px;
        line-height: 1.3;
        font-weight: 850;
        letter-spacing: -0.3px;
      }

      .text-button {
        min-height: 40px;
        padding: 0 10px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--interactive-text);
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }

      .button {
        min-height: 52px;
        border: 0;
        border-radius: 17px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 850;
        cursor: pointer;
        transition:
          transform 150ms ease-out,
          filter 150ms ease-out,
          background-color 150ms ease-out;
      }

      .button:hover {
        filter: brightness(1.04);
      }

      .button.primary {
        background: linear-gradient(
          135deg,
          var(--primary-pressed),
          var(--primary)
        );
        color: var(--on-primary);
        box-shadow: 0 12px 24px rgba(89, 130, 43, 0.22);
      }

      .button.secondary {
        background: var(--primary-soft);
        color: var(--interactive-text);
      }

      .button.outline {
        border: 1.5px solid var(--interactive-text);
        background: transparent;
        color: var(--interactive-text);
      }

      .button.danger {
        background: #fae5e7;
        color: #9f2730;
      }

      .button.full {
        width: 100%;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .card {
        border-radius: var(--radius-lg);
        padding: 16px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }

      .card.soft {
        background: var(--surface-soft);
        box-shadow: none;
      }

      .card.purple {
        background: var(--surface-purple);
        box-shadow: none;
      }

      .card-button {
        width: 100%;
        min-height: 66px;
        border: 0;
        border-radius: 20px;
        padding: 11px 13px;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        background: var(--surface);
        color: var(--ink);
        text-align: start;
        box-shadow: var(--shadow-card);
        cursor: pointer;
        transition:
          transform 150ms ease-out,
          box-shadow 150ms ease-out;
      }

      .card-button:hover {
        box-shadow: var(--shadow-float);
      }

      .leading {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 18px;
        font-weight: 850;
      }

      .leading.pink {
        background: linear-gradient(145deg, #ff79ad, #e94084);
      }

      .leading.orange {
        background: linear-gradient(145deg, #ffc24f, #ff8a32);
      }

      .leading.purple {
        background: linear-gradient(145deg, #856af3, #4f38ce);
      }

      .leading.green {
        background: linear-gradient(145deg, #6cc995, #359a65);
      }

      .card-copy {
        min-width: 0;
      }

      .card-copy strong {
        display: block;
        font-size: 14px;
        line-height: 1.35;
        font-weight: 850;
      }

      .card-copy small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      .trailing {
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        text-align: end;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 32px;
        padding: 0 11px;
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--ink);
        font-size: 11px;
        font-weight: 750;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
      }

      .status[data-device="offline"] .status-dot {
        background: var(--muted);
      }

      .status[data-device="attention"] .status-dot {
        background: var(--orange);
      }

      .hero {
        position: relative;
        min-height: 206px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: var(--radius-xl);
        padding: 24px;
        background:
          radial-gradient(
            circle at 78% 22%,
            rgba(255, 255, 255, 0.16),
            transparent 21%
          ),
          linear-gradient(135deg, #93db4f 0%, #baff72 56%, #d8ffad 100%);
        color: var(--on-primary);
        box-shadow:
          0 18px 34px rgba(89, 130, 43, 0.22),
          0 2px 6px rgba(89, 130, 43, 0.12);
      }

      .hero-copy {
        position: relative;
        z-index: 2;
        width: 55%;
      }

      .hero .eyebrow {
        color: var(--on-primary);
        opacity: 0.72;
      }

      .hero h2 {
        margin: 8px 0 4px;
        font-size: 31px;
        line-height: 1.1;
        font-weight: 900;
        letter-spacing: -1px;
      }

      .hero p {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        opacity: 0.86;
      }

      .hero .button {
        min-height: 42px;
        margin-top: 17px;
        padding: 0 17px;
        border-radius: 14px;
        background: var(--on-primary);
        color: var(--primary);
        box-shadow: 0 7px 16px rgba(20, 33, 17, 0.2);
        font-size: 12px;
      }

      .hero-mascot {
        position: absolute;
        z-index: 1;
        width: 205px;
        height: auto;
        inset-inline-end: -18px;
        top: -4px;
        filter: drop-shadow(0 13px 14px rgba(35, 19, 92, 0.18));
        pointer-events: none;
      }

      .progress {
        height: 8px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--line);
      }

      .progress > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          var(--orange),
          var(--pink),
          var(--primary)
        );
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }

      .stat {
        min-height: 91px;
        border-radius: 19px;
        padding: 13px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }

      .stat strong {
        display: block;
        margin-top: 9px;
        font-size: 20px;
        line-height: 1;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }

      .stat small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.25;
      }

      .nav {
        position: absolute;
        z-index: 20;
        inset-inline: 16px;
        bottom: 14px;
        height: 70px;
        padding: 8px 9px;
        border-radius: 25px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        align-items: center;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        box-shadow: var(--shadow-float);
        backdrop-filter: blur(16px);
      }

      .nav-button {
        min-width: 0;
        height: 50px;
        border: 0;
        border-radius: 18px;
        display: grid;
        place-items: center;
        gap: 2px;
        background: transparent;
        color: var(--ink);
        font-size: 9px;
        cursor: pointer;
        transition:
          transform 150ms ease-out,
          background-color 150ms ease-out,
          color 150ms ease-out;
      }

      .nav-button .icon {
        width: 20px;
        height: 20px;
      }

      .nav-button[aria-current="page"] {
        background: var(--primary);
        color: var(--on-primary);
      }

      .nav-button.quick {
        width: 50px;
        justify-self: center;
        border-radius: 50%;
        background: var(--primary);
        color: var(--on-primary);
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field label,
      .field legend {
        color: var(--ink);
        font-size: 13px;
        font-weight: 800;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 52px;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        padding: 12px 14px;
        background: var(--surface);
        color: var(--ink);
        font-size: 16px;
      }

      .field textarea {
        min-height: 92px;
        resize: vertical;
      }

      .field input[aria-invalid="true"] {
        border-color: var(--red);
      }

      .field-error {
        margin: 0;
        color: var(--red);
        font-size: 12px;
        line-height: 1.4;
      }

      .choice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .choice {
        min-height: 108px;
        border: 1.5px solid var(--line);
        border-radius: 19px;
        padding: 15px;
        background: var(--surface);
        color: var(--ink);
        text-align: start;
        cursor: pointer;
        transition:
          transform 150ms ease-out,
          border-color 150ms ease-out,
          background-color 150ms ease-out;
      }

      .choice[aria-pressed="true"] {
        border-color: var(--primary-strong);
        background: var(--primary-soft);
      }

      .choice strong,
      .choice small {
        display: block;
      }

      .choice strong {
        margin-top: 12px;
        font-size: 14px;
      }

      .choice small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .segmented {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 4px;
        padding: 4px;
        border-radius: 16px;
        background: var(--surface-soft);
      }

      .segmented button {
        min-height: 42px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
        cursor: pointer;
      }

      .segmented button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 3px 10px rgba(37, 26, 83, 0.08);
      }

      .notice {
        border-radius: 18px;
        padding: 14px;
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 10px;
        background: var(--surface-purple);
        color: var(--ink);
      }

      .notice strong {
        display: block;
        font-size: 13px;
      }

      .notice p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .notice.warning {
        background: #fff0d8;
      }

      [data-theme="night"] .notice.warning {
        background: #4a3821;
      }

      .onboarding {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      .onboarding-visual {
        position: relative;
        flex: 1;
        min-height: 340px;
        overflow: hidden;
        margin-inline: -20px;
      }

      .onboarding-visual::before {
        content: "";
        position: absolute;
        width: 290px;
        height: 290px;
        inset-inline-end: -68px;
        top: 25px;
        border-radius: 50%;
        background: var(--surface-purple);
      }

      .onboarding-visual img {
        position: absolute;
        width: 390px;
        max-width: none;
        inset-inline-start: -30px;
        bottom: -26px;
        filter: drop-shadow(0 20px 25px rgba(49, 26, 123, 0.18));
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin: 20px 0;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--line);
      }

      .dot.active {
        width: 24px;
        background: var(--primary-strong);
      }

      .code-input {
        letter-spacing: 0.18em;
        text-align: center;
        text-transform: uppercase;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .pairing-orbit {
        position: relative;
        width: 250px;
        height: 250px;
        margin: 18px auto 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle,
          var(--surface-purple) 0 41%,
          transparent 42% 51%,
          rgba(112, 79, 231, 0.1) 52% 61%,
          transparent 62%
        );
      }

      .pairing-orbit img {
        width: 190px;
        transform: translateY(18px);
      }

      .device-card {
        display: grid;
        grid-template-columns: 46px 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .device-face {
        width: 46px;
        height: 46px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        background: #18162b;
        color: #5df0dc;
        font-size: 20px;
      }

      .counter-layout {
        min-height: calc(100% - 76px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .counter-number {
        margin: 36px 0 0;
        font-size: 100px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -5px;
        font-variant-numeric: tabular-nums;
      }

      .counter-target {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      .counter-controls {
        display: grid;
        grid-template-columns: 64px 108px 64px;
        align-items: center;
        gap: 18px;
        margin-top: 38px;
      }

      .counter-button {
        width: 64px;
        height: 64px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--surface);
        color: var(--ink);
        font-size: 25px;
        box-shadow: var(--shadow-card);
        cursor: pointer;
        transition: transform 150ms ease-out;
      }

      .counter-button.main {
        width: 108px;
        height: 108px;
        background: linear-gradient(
          145deg,
          var(--primary),
          var(--primary-pressed)
        );
        color: var(--on-primary);
        box-shadow: 0 18px 36px rgba(89, 130, 43, 0.25);
      }

      .timer-ring {
        width: 228px;
        height: 228px;
        margin: 28px auto 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(
          var(--primary) 0 62%,
          var(--surface-purple) 62% 100%
        );
        position: relative;
      }

      .timer-ring::after {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        background: var(--bg);
      }

      .timer-copy {
        position: relative;
        z-index: 1;
      }

      .timer-copy strong {
        display: block;
        font-size: 48px;
        line-height: 1;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }

      .timer-copy small {
        display: block;
        margin-top: 7px;
        color: var(--muted);
      }

      .chart {
        height: 180px;
        padding-top: 20px;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        align-items: end;
        gap: 8px;
      }

      .bar {
        display: grid;
        gap: 7px;
        justify-items: center;
        color: var(--muted);
        font-size: 10px;
      }

      .bar i {
        width: 100%;
        min-height: 12px;
        border-radius: 8px 8px 4px 4px;
        background: linear-gradient(180deg, #967fff, #5632d6);
      }

      .badge-row {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        margin-inline-end: -20px;
        padding: 4px 20px 10px 2px;
        scrollbar-width: none;
      }

      .badge-card {
        flex: 0 0 122px;
        min-height: 135px;
        border-radius: 23px;
        padding: 14px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
        text-align: center;
      }

      .badge-medal {
        width: 66px;
        height: 66px;
        margin: 0 auto 9px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #ffe06b, #ff9b2f);
        color: #5b2e04;
        font-size: 25px;
        box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.35);
      }

      .settings-list {
        overflow: hidden;
        border-radius: 22px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }

      .setting-row {
        width: 100%;
        min-height: 62px;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 9px 14px;
        display: grid;
        grid-template-columns: 38px 1fr auto;
        gap: 11px;
        align-items: center;
        background: transparent;
        color: var(--ink);
        text-align: start;
        cursor: pointer;
      }

      .setting-row:last-child {
        border-bottom: 0;
      }

      .switch {
        position: relative;
        width: 48px;
        height: 29px;
      }

      .switch input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--line);
        cursor: pointer;
      }

      .switch span::after {
        content: "";
        position: absolute;
        width: 23px;
        height: 23px;
        inset-inline-start: 3px;
        top: 3px;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
        transition: transform 180ms ease-out;
      }

      .switch input:checked + span {
        background: var(--primary);
      }

      .switch input:checked + span::after {
        background: var(--on-primary);
        transform: translateX(19px);
      }

      .profile-avatar {
        width: 94px;
        height: 94px;
        margin: 10px auto 14px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--surface-purple);
        box-shadow: 0 0 0 6px var(--surface);
      }

      .profile-avatar img {
        width: 118px;
        transform: translateY(23px);
      }

      .sync-steps {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .sync-step {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 11px;
        align-items: center;
      }

      .sync-check {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #dff5e8;
        color: #1f8050;
        font-weight: 900;
      }

      .empty {
        min-height: 480px;
        display: grid;
        place-content: center;
        justify-items: center;
        text-align: center;
      }

      .empty img {
        width: 230px;
        margin-bottom: 18px;
        opacity: 0.82;
      }

      .modal-layer {
        position: absolute;
        z-index: 50;
        inset: 0;
        display: none;
        align-items: flex-end;
        background: rgba(21, 16, 53, 0.35);
        backdrop-filter: blur(3px);
      }

      .modal-layer.open {
        display: flex;
      }

      .modal {
        width: 100%;
        max-height: 88%;
        overflow-y: auto;
        overscroll-behavior: contain;
        border-radius: 30px 30px 0 0;
        padding: 12px 20px 30px;
        background: var(--bg);
        color: var(--ink);
        box-shadow: 0 -22px 55px rgba(25, 17, 70, 0.18);
      }

      .handle {
        width: 42px;
        height: 4px;
        margin: 0 auto 20px;
        border-radius: 99px;
        background: var(--line);
      }

      .toast {
        position: absolute;
        z-index: 70;
        inset-inline: 18px;
        bottom: 98px;
        min-height: 48px;
        border-radius: 16px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        background: #211a47;
        color: #fff;
        box-shadow: var(--shadow-float);
        font-size: 13px;
        line-height: 1.4;
        font-weight: 700;
      }

      .prototype-map-button {
        position: fixed;
        z-index: 2147483646;
        top: 24px;
        inset-inline-end: 24px;
        min-height: 38px;
        border: 0;
        border-radius: 999px;
        padding: 0 15px;
        background: rgba(13, 11, 22, 0.84);
        color: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(12px);
        font-size: 12px;
        font-weight: 750;
        cursor: pointer;
      }

      .prototype-map {
        position: fixed;
        z-index: 2147483647;
        top: 72px;
        inset-inline-end: 24px;
        width: min(330px, calc(100vw - 32px));
        max-height: calc(100vh - 96px);
        overflow-y: auto;
        display: none;
        border-radius: 22px;
        padding: 14px;
        background: rgba(17, 15, 25, 0.94);
        color: #fff;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .prototype-map.open {
        display: block;
      }

      .prototype-map h2 {
        margin: 2px 4px 10px;
        font-size: 14px;
      }

      .map-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .map-grid button,
      .state-controls button {
        min-height: 36px;
        border: 0;
        border-radius: 10px;
        padding: 7px 9px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.75);
        text-align: start;
        font-size: 11px;
        cursor: pointer;
      }

      .map-grid button[aria-current="true"] {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }

      .state-controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }

      .state-controls button {
        text-align: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 560px) {
        body {
          overflow: hidden;
          background: var(--bg);
        }

        .shell {
          display: block;
          padding: 0;
        }

        .phone {
          width: 100%;
          height: 100vh;
          min-height: 620px;
          border-radius: 0;
          box-shadow: none;
        }

        .prototype-map-button {
          top: 10px;
          inset-inline-end: 10px;
          opacity: 0.74;
        }

        .prototype-map {
          top: 56px;
          inset-inline: 10px;
          width: auto;
        }
      }

      @media (max-width: 340px) {
        .screen {
          padding-inline: 16px;
        }

        .stats-grid {
          grid-template-columns: 1fr;
        }

        .choice-grid,
        .button-row {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <script>
      const screens = [
        ["welcome", "Welcome"],
        ["activation", "Aktivasi"],
        ["account", "Buat akun"],
        ["pairing", "Pairing"],
        ["starter", "Starter habit"],
        ["firstwin", "First win"],
        ["home", "Home"],
        ["habits", "Habits"],
        ["habit-detail", "Detail habit"],
        ["habit-create", "Buat habit"],
        ["quick", "Quick activity"],
        ["counter", "Active counter"],
        ["session", "Active session"],
        ["quba", "Quba/device"],
        ["stats", "Statistik"],
        ["history", "Activity history"],
        ["profile", "Profil"],
        ["settings", "Settings"],
        ["empty", "Empty state"],
      ];

      const mainTabs = {
        home: "home",
        habits: "habits",
        quba: "quba",
        stats: "stats",
        profile: "profile",
      };

      const state = {
        route: "welcome",
        device: "connected",
        theme: "light",
        counter: 28,
        quickType: "session",
        linkMode: "linked",
        destination: "quba",
        timerRunning: true,
        timerSeconds: 1182,
      };

      const screenRoot = document.getElementById("screen");
      const navRoot = document.getElementById("nav-root");
      const phone = document.getElementById("phone");
      const modalLayer = document.getElementById("modal-layer");
      const liveRegion = document.getElementById("live-region");
      const mapButton = document.getElementById("prototype-map-button");
      const mapPanel = document.getElementById("prototype-map");
      const mapGrid = document.getElementById("map-grid");
      let lastModalTrigger = null;
      let toastTimer = null;
      let timerId = null;

      function cloneTemplate(id) {
        return document.getElementById(id).content.cloneNode(true);
      }

      function renderMap() {
        mapGrid.innerHTML = "";
        screens.forEach(function (entry) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = entry[1];
          button.dataset.go = entry[0];
          if (entry[0] === state.route)
            button.setAttribute("aria-current", "true");
          mapGrid.appendChild(button);
        });
      }

      function applyDeviceState() {
        document
          .querySelectorAll(".device-status, .status")
          .forEach(function (el) {
            el.dataset.device = state.device;
          });
        document.querySelectorAll("[data-device-label]").forEach(function (el) {
          el.textContent =
            state.device === "connected"
              ? "Terhubung"
              : state.device === "offline"
                ? "Tidak terhubung"
                : "Perlu tindakan";
        });
        document.querySelectorAll("[data-device-copy]").forEach(function (el) {
          el.textContent =
            state.device === "connected"
              ? "Berjalan di Quba"
              : state.device === "offline"
                ? "Quba sedang offline"
                : "Periksa koneksi Quba";
        });
      }

      function render() {
        const template = document.getElementById("screen-" + state.route);
        if (!template) {
          state.route = "home";
          return render();
        }

        screenRoot.innerHTML = "";
        screenRoot.appendChild(template.content.cloneNode(true));
        navRoot.innerHTML = "";

        const tab = mainTabs[state.route];
        if (tab) {
          navRoot.appendChild(cloneTemplate("nav-template"));
          navRoot.querySelectorAll("[data-tab]").forEach(function (button) {
            if (button.dataset.tab === tab)
              button.setAttribute("aria-current", "page");
          });
        }

        const themeToggle = document.getElementById("theme-toggle");
        if (themeToggle) themeToggle.checked = state.theme === "night";
        const counterValue = document.getElementById("counter-value");
        if (counterValue) counterValue.textContent = String(state.counter);
        updateTimerUI();
        applyDeviceState();
        renderMap();
        screenRoot.scrollTop = 0;
        screenRoot.focus({ preventScroll: true });
        history.replaceState(null, "", "#" + state.route);
      }

      function go(route) {
        closeModal();
        state.route = route;
        mapPanel.classList.remove("open");
        mapButton.setAttribute("aria-expanded", "false");
        render();
      }

      function announce(message) {
        liveRegion.textContent = "";
        window.setTimeout(function () {
          liveRegion.textContent = message;
        }, 20);
      }

      function toast(message) {
        const old = phone.querySelector(".toast");
        if (old) old.remove();
        window.clearTimeout(toastTimer);
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = message;
        phone.appendChild(el);
        announce(message);
        toastTimer = window.setTimeout(function () {
          el.remove();
        }, 2600);
      }

      function openModal(id, trigger) {
        lastModalTrigger = trigger || document.activeElement;
        modalLayer.innerHTML = "";
        modalLayer.appendChild(cloneTemplate(id));
        modalLayer.classList.add("open");
        modalLayer.setAttribute("aria-hidden", "false");
        screenRoot.inert = true;
        navRoot.inert = true;
        const first = modalLayer.querySelector("button");
        if (first) first.focus();
      }

      function closeModal() {
        if (!modalLayer.classList.contains("open")) return;
        modalLayer.classList.remove("open");
        modalLayer.setAttribute("aria-hidden", "true");
        modalLayer.innerHTML = "";
        screenRoot.inert = false;
        navRoot.inert = false;
        if (lastModalTrigger && document.contains(lastModalTrigger))
          lastModalTrigger.focus();
      }

      function validateRequired(form, names) {
        let valid = true;
        let first = null;
        names.forEach(function (name) {
          const input = form.elements[name];
          if (!input || String(input.value).trim()) return;
          valid = false;
          input.setAttribute("aria-invalid", "true");
          if (!first) first = input;
        });
        if (first) first.focus();
        return valid;
      }

      function updateTimerUI() {
        const value = document.getElementById("timer-value");
        if (!value) return;
        const minutes = Math.floor(state.timerSeconds / 60);
        const seconds = state.timerSeconds % 60;
        value.textContent =
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0");
        const use = document.querySelector("#timer-icon use");
        if (use)
          use.setAttribute("href", state.timerRunning ? "#i-pause" : "#i-play");
        const button = document.querySelector("[data-action='timer-toggle']");
        if (button)
          button.setAttribute(
            "aria-label",
            state.timerRunning ? "Pause session" : "Lanjutkan session",
          );
      }

      function startTimer() {
        if (timerId) window.clearInterval(timerId);
        timerId = window.setInterval(function () {
          if (!state.timerRunning || state.route !== "session") return;
          if (state.timerSeconds > 0) state.timerSeconds -= 1;
          updateTimerUI();
          if (state.timerSeconds === 0) {
            state.timerRunning = false;
            openModal("modal-complete");
          }
        }, 1000);
      }

      document.addEventListener("click", function (event) {
        const goButton = event.target.closest("[data-go]");
        if (goButton) {
          go(goButton.dataset.go);
          return;
        }

        const deviceButton = event.target.closest("[data-device-state]");
        if (deviceButton) {
          state.device = deviceButton.dataset.deviceState;
          render();
          toast(
            state.device === "connected"
              ? "Quba terhubung kembali."
              : state.device === "offline"
                ? "Quba tidak terhubung. Aktivitas tersinkron tetap tersedia."
                : "Quba memerlukan tindakan. Buka halaman perangkat untuk detail.",
          );
          return;
        }

        const starter = event.target.closest("[data-starter]");
        if (starter) {
          document.querySelectorAll("[data-starter]").forEach(function (el) {
            const active = el === starter;
            el.setAttribute("aria-pressed", active ? "true" : "false");
            el.lastElementChild.textContent = active ? "✓" : "";
          });
          return;
        }

        const choiceSelectors = [
          ["data-habit-type", "[data-habit-type]"],
          ["data-quick-type", "[data-quick-type]"],
          ["data-link-mode", "[data-link-mode]"],
          ["data-destination", "[data-destination]"],
        ];
        for (let i = 0; i < choiceSelectors.length; i += 1) {
          const attr = choiceSelectors[i][0];
          const selector = choiceSelectors[i][1];
          const choice = event.target.closest(selector);
          if (!choice) continue;
          document.querySelectorAll(selector).forEach(function (el) {
            el.setAttribute("aria-pressed", el === choice ? "true" : "false");
          });
          if (attr === "data-quick-type")
            state.quickType = choice.dataset.quickType;
          if (attr === "data-link-mode") {
            state.linkMode = choice.dataset.linkMode;
            const field = document.getElementById("quick-link-field");
            const notice = document.getElementById("quick-mode-notice");
            if (field) field.hidden = state.linkMode === "standalone";
            if (notice) {
              notice.querySelector("strong").textContent =
                state.linkMode === "standalone"
                  ? "Aktivitas dicatat sebagai Standalone."
                  : "Progres masuk ke Baca Qur’an.";
              notice.querySelector("p").textContent =
                state.linkMode === "standalone"
                  ? "Tidak membuat occurrence, streak, badge, atau XP."
                  : "Penyelesaian occurrence hanya memberi XP satu kali.";
            }
          }
          if (attr === "data-destination")
            state.destination = choice.dataset.destination;
          return;
        }

        const filter = event.target.closest(
          "[data-action='habit-filter'], [data-action='history-filter']",
        );
        if (filter) {
          filter.parentElement
            .querySelectorAll("button")
            .forEach(function (el) {
              el.setAttribute("aria-pressed", el === filter ? "true" : "false");
            });
          toast("Filter " + filter.textContent + " diterapkan.");
          return;
        }

        const counter = event.target.closest("[data-counter]");
        if (counter) {
          state.counter = Math.max(
            0,
            Math.min(33, state.counter + Number(counter.dataset.counter)),
          );
          const value = document.getElementById("counter-value");
          if (value) value.textContent = String(state.counter);
          announce(state.counter + " dari 33 hitungan");
          if (state.counter === 33) openModal("modal-complete", counter);
          return;
        }

        const actionButton = event.target.closest("[data-action]");
        if (!actionButton) return;
        const action = actionButton.dataset.action;

        if (action === "open-map") {
          mapPanel.classList.add("open");
          mapButton.setAttribute("aria-expanded", "true");
        } else if (action === "pair") {
          actionButton.disabled = true;
          actionButton.textContent = "Menghubungkan…";
          window.setTimeout(function () {
            state.device = "connected";
            go("starter");
            toast("Quba-1234 berhasil dihubungkan.");
          }, 650);
        } else if (action === "first-win") {
          openModal("modal-complete", actionButton);
        } else if (action === "sync") {
          if (state.device === "offline") {
            toast("Quba belum terhubung. Dekatkan ponsel dan coba lagi.");
          } else if (state.device === "attention") {
            openModal("modal-partial", actionButton);
          } else {
            openModal("modal-sync", actionButton);
          }
        } else if (action === "counter-reset") {
          state.counter = 0;
          document.getElementById("counter-value").textContent = "0";
          toast("Counter dikembalikan ke 0.");
        } else if (action === "timer-toggle") {
          state.timerRunning = !state.timerRunning;
          updateTimerUI();
          announce(
            state.timerRunning ? "Session dilanjutkan." : "Session dijeda.",
          );
        } else if (action === "finish-session") {
          state.timerRunning = false;
          openModal("modal-complete", actionButton);
        } else if (action === "cancel-activity") {
          openModal("modal-confirm", actionButton);
        } else if (action === "notifications") {
          toast("Tidak ada pemberitahuan yang memerlukan tindakan.");
        } else if (action === "completed-info") {
          toast("Selesai pukul 07.12 · tersinkron dari Quba.");
        } else if (action === "standalone-info") {
          toast("Standalone · tidak memengaruhi streak, badge, atau XP.");
        } else if (action === "device-test") {
          toast("Ekspresi tes dikirim ke Quba.");
        } else if (action === "bluetooth-help") {
          toast("Pastikan Bluetooth aktif dan Quba berada dalam jarak dekat.");
        } else if (action === "recovery") {
          toast("Tautan pemulihan akan dikirim ke email akun.");
        } else if (action === "edit-habit") {
          go("habit-create");
        } else if (action === "habit-menu") {
          toast("Opsi: edit, nonaktifkan, atau arsipkan habit.");
        } else if (action === "activity-info") {
          toast("Aktivitas tersimpan lokal dan aman jika koneksi terputus.");
        } else if (action === "badges-info") {
          toast("Badge diberikan pada 7, 30, dan 90 occurrence beruntun.");
        } else if (action === "language") {
          toast(
            "Bahasa Indonesia aktif. English tersedia pada implementasi penuh.",
          );
        } else if (action === "prayer-settings") {
          toast(
            "Jadwal shalat menampilkan metode, lokasi, dan offset sebelum disinkronkan.",
          );
        } else if (action === "edit-profile") {
          toast("Profil siap diedit.");
        } else if (action === "support") {
          toast("Versi app 1.0.0 · firmware Quba 1.0.");
        } else if (action === "unbind") {
          toast("Pelepasan Quba memerlukan verifikasi akun.");
        }
      });

      document.addEventListener("submit", function (event) {
        event.preventDefault();
        const form = event.target;
        const kind = form.dataset.form;
        if (kind === "activation") {
          const input = form.elements.code;
          const error = document.getElementById("activation-error");
          if (!/^QBA-[A-Z0-9]{4}$/i.test(input.value.trim())) {
            input.setAttribute("aria-invalid", "true");
            error.hidden = false;
            error.textContent = "Gunakan format QBA-1234.";
            input.focus();
            return;
          }
          go("account");
        } else if (kind === "account") {
          if (validateRequired(form, ["name", "email", "password"]))
            go("pairing");
        } else if (kind === "login") {
          if (validateRequired(form, ["identifier", "password"])) go("home");
        } else if (kind === "habit") {
          if (!validateRequired(form, ["name", "target", "time"])) return;
          state.device === "connected"
            ? openModal("modal-sync", form.querySelector("[type='submit']"))
            : toast("Habit tersimpan di ponsel dan akan disinkronkan nanti.");
        } else if (kind === "quick") {
          if (!validateRequired(form, ["target"])) return;
          if (state.destination === "quba" && state.device !== "connected") {
            toast(
              "Quba tidak tersedia. Pilih jalankan di app atau hubungkan Quba.",
            );
            return;
          }
          go(state.quickType === "counter" ? "counter" : "session");
        }
      });

      document.addEventListener("change", function (event) {
        if (event.target.id === "theme-toggle") {
          state.theme = event.target.checked ? "night" : "light";
          document.documentElement.dataset.theme = state.theme;
          announce(
            state.theme === "night"
              ? "Tema malam aktif."
              : "Tema terang aktif.",
          );
        } else if (event.target.matches("#sound-toggle, #prayer-toggle")) {
          toast(
            event.target.checked
              ? "Pengaturan diaktifkan."
              : "Pengaturan dinonaktifkan.",
          );
        }
      });

      modalLayer.addEventListener("click", function (event) {
        if (
          event.target === modalLayer ||
          event.target.closest("[data-close-modal]")
        ) {
          closeModal();
          return;
        }
        if (event.target.closest("[data-complete-home]")) {
          closeModal();
          go("home");
          toast("Progres hari ini diperbarui.");
        } else if (event.target.closest("[data-cancel-confirm]")) {
          closeModal();
          go("home");
          toast("Aktivitas dibatalkan. Tidak ada XP yang diberikan.");
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          if (modalLayer.classList.contains("open")) closeModal();
          else if (mapPanel.classList.contains("open")) {
            mapPanel.classList.remove("open");
            mapButton.setAttribute("aria-expanded", "false");
            mapButton.focus();
          }
        }
        if (event.key === "Tab" && modalLayer.classList.contains("open")) {
          const focusable = Array.from(
            modalLayer.querySelectorAll(
              "button:not([disabled]), input:not([disabled]), select:not([disabled])",
            ),
          );
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });

      mapButton.addEventListener("click", function () {
        const open = !mapPanel.classList.contains("open");
        mapPanel.classList.toggle("open", open);
        mapButton.setAttribute("aria-expanded", open ? "true" : "false");
      });

      const initialRoute = location.hash.replace("#", "");
      if (
        screens.some(function (entry) {
          return entry[0] === initialRoute;
        })
      )
        state.route = initialRoute;
      document.documentElement.dataset.theme = state.theme;
      renderMap();
      render();
      startTimer();
    </script>
  </body>
</html>
