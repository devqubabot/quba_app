name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required engineering contract
        shell: bash
        run: |
          required_files=(
            "AGENTS.md"
            "QUBA_PRD_MVP_v1.0.md"
            "docs/architecture/overview.md"
            "docs/decisions/README.md"
            "docs/engineering/coding-standards.md"
            "docs/engineering/testing-strategy.md"
            "docs/engineering/definition-of-done.md"
            "docs/tasks/TEMPLATE.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required contract file is missing or empty: $file"
              exit 1
            fi
          done

  app-quality:
    name: App quality gates
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require reproducible npm project
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          test -f package-lock.json
          npm ci

      - name: Run canonical quality command
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run check

      - name: Explain pre-scaffold state
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "Expo app has not been scaffolded; app quality gates will activate when package.json exists."

